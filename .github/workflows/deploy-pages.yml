name: Deploy CCPC INE Intelligence Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify processed CCPC datasets and rebuild artifacts if needed
        run: |
          python -c "
          import os, pandas as pd
          p = 'processed_data/ccpc_macro_2009_2024.parquet'
          assert os.path.exists(p), 'Missing parquet file'
          df = pd.read_parquet(p)
          print(f'Verified CCPC macro dataset: {len(df):,} rows')
          "

      - name: Prepare static site bundle (_site)
        run: |
          mkdir -p _site/figures _site/processed_data
          cp index.html _site/index.html
          cp dashboard_ccpc_ine.html _site/dashboard_ccpc_ine.html
          cp figures/*.png _site/figures/
          cp processed_data/*.json _site/processed_data/
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
